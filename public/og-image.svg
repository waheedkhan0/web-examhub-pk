<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="230" cy="90" r="330" fill="url(#glow1)"/>
  <circle cx="1010" cy="560" r="330" fill="url(#glow2)"/>

  <!-- Logo tile -->
  <rect x="90" y="86" width="76" height="76" rx="18" fill="#0d9488"/>
  <text x="128" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
  <text x="186" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">ExamHub<tspan fill="#5eead4">.pk</tspan></text>

  <!-- Headline -->
  <text x="90" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Pakistani Competitive</text>
  <text x="90" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#5eead4">Exam Preparation</text>

  <!-- Subline -->
  <text x="90" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#cbd5e1">MCQs with worked explanations, subject roadmaps and study guides.</text>

  <!-- Exam chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#99f6e4">
    <rect x="90" y="490" width="104" height="52" rx="14" fill="#0f766e" fill-opacity="0.55" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="142" y="525" text-anchor="middle">CSS</text>
    <rect x="210" y="490" width="104" height="52" rx="14" fill="#0f766e" fill-opacity="0.55" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="262" y="525" text-anchor="middle">PMS</text>
    <rect x="330" y="490" width="128" height="52" rx="14" fill="#0f766e" fill-opacity="0.55" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="394" y="525" text-anchor="middle">PPSC</text>
    <rect x="474" y="490" width="128" height="52" rx="14" fill="#0f766e" fill-opacity="0.55" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="538" y="525" text-anchor="middle">FPSC</text>
    <rect x="618" y="490" width="112" height="52" rx="14" fill="#0f766e" fill-opacity="0.55" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="674" y="525" text-anchor="middle">NTS</text>
  </g>

  <text x="1110" y="525" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">examhub.pk</text>
</svg>
