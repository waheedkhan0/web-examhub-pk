# HTTP - Redirect all traffic to HTTPS apex domain
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name examhub.pk www.examhub.pk _;

    return 301 https://examhub.pk$request_uri;
}

# HTTPS - Reverse Proxy to Astro application
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name examhub.pk;

    client_max_body_size 50M;

    # SSL certificates managed via Certbot / Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/examhub.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/examhub.pk/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS - Redirect www to apex domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.examhub.pk;

    ssl_certificate /etc/letsencrypt/live/examhub.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/examhub.pk/privkey.pem;

    return 301 https://examhub.pk$request_uri;
}
